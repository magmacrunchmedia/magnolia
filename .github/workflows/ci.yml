# The jobs are split by what they actually need, not by convenience.
#
# The host tests need nothing but a C compiler, so they run on a GitHub-hosted
# runner. That is deliberate: these are the tests that must still run when the
# dev box is off, and the whole argument for having them is that they are
# reachable from anywhere. Tying them to one machine would undo that.
#
# The devkitPPC build needs a cross-compiler, which is the whole reason it sat
# unrun for so long: it was taken to need a self-hosted runner, and a job queued
# against a label no runner offers waits forever rather than failing. It does not
# -- devkitPro publish the toolchain as a container, so this runs on a
# GitHub-hosted runner too and neither job depends on a particular machine.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # prefs, scoring, menu and gamestate: every engine module that is free of
      # libogc. Storage is the reason this exists -- an emulated SD card can
      # report itself mounted and refuse every write, and only a test running
      # off-console can tell that apart from a broken save.
      - name: make test
        run: make test

  # The engine's other half -- renderer, sprite, audio, core, input, ui_utils --
  # is bound to GRRLIB and libogc, so it has no host tests and, until this job,
  # no automated check of any kind. This build is what stands in for them: it
  # compiles the engine with no game directory on the include path, so a change
  # that breaks the console build, or that reaches back into a game header,
  # fails here rather than in the next game months later.
  #
  # It was held back waiting on a self-hosted runner, which turned out not to be
  # necessary -- devkitPro publish the toolchain as a container that runs on a
  # GitHub-hosted one. DEVKITPRO and DEVKITPPC come from the image's own
  # environment; setting them here would only invite a hardcoded path to drift
  # away from wherever the image actually puts the toolchain.
  engine-build:
    name: standalone engine build
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      # GRRLIB is not a dkp-pacman package -- it is built from source and
      # installed into the portlibs tree. Its own dependencies (freetype, libpng,
      # libjpeg-turbo) arrive with the image's ppc-portlibs and wii-portlibs
      # groups, so nothing else needs installing.
      #
      # Pinned rather than tracking master: an unpinned dependency means GRRLIB
      # can turn this repo's CI red on a day nobody touched this repo. v4.6.1 is
      # the current 4.6, which is the version the README's dependency table names.
      #
      # The install lands in $DEVKITPRO/portlibs/wii -- GRRLIB's Makefile takes
      # PORTLIBS_PATH from devkitPPC's wii_rules -- which is the directory the
      # engine Makefile already has on its include path.
      - name: install GRRLIB
        run: |
          git clone --depth 1 --branch v4.6.1 https://github.com/GRRLIB/GRRLIB.git /tmp/grrlib
          make -C /tmp/grrlib/GRRLIB clean all install

      - name: make
        run: make
